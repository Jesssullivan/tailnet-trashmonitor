# Per-stream LoadBalancer Services live in stream-<id>.yaml. This file
# now only carries the cluster-internal ClusterIP that Prometheus (or
# any in-cluster scraper) uses to reach MediaMTX's metrics + API across
# all per-stream pods.
#
# The selector intentionally matches on app.kubernetes.io/name only,
# not on trashmonitor.stream, so a single scrape config picks up every
# per-stream pod and Prometheus differentiates them by pod IP /
# instance label.
apiVersion: v1
kind: Service
metadata:
  name: trashmonitor-metrics
  namespace: trashmonitor
  labels:
    app.kubernetes.io/name: trashmonitor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trashmonitor
  ports:
    - { name: api,     port: 9997, targetPort: api,     protocol: TCP }
    - { name: metrics, port: 9998, targetPort: metrics, protocol: TCP }
