apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trashmonitor

resources:
  - namespace.yaml
  - service.yaml
  # Per-stream Deployments + LB Services. Add a new stream by copying
  # stream-cam-a.yaml to stream-<id>.yaml and listing it here.
  - stream-cam-a.yaml
  - stream-cam-b.yaml
  # cert.yaml provisions a Let's Encrypt cert via cert-manager DNS-01.
  # Edit <your-zone> + <your-acme-email> first, ensure cert-manager is
  # installed, and uncomment to apply.
  # - cert.yaml
  #
  # servicemonitor.yaml requires the prometheus-operator CRDs. Apply
  # manually once CRDs are present:
  #   kubectl apply -f server/k8s/servicemonitor.yaml
  # PrometheusRule (otel/alert-rules.yaml) similarly.

# House labels (matches the live trashmonitor namespace on the honey
# cluster; see ../blahaj for the broader convention). Propagated to
# pod templates and selectors so per-stream selectors stay correct.
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: trashmonitor
      blahaj.dev/layer: tailnet

images:
  - name: ghcr.io/<your-org>/tailnet-trashmonitor
    newTag: 0.0.1
