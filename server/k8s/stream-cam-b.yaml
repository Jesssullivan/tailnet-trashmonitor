# Per-stream manifest for cam-b.
#
# To add a new stream: copy this file to stream-<id>.yaml, replace
# `cam-b` with the new id everywhere (including labels and Service
# names), and add it to kustomization.yaml's `resources:` list. The
# camera id must match the trashcam@<id>.service instance and the
# `id` field in the ansible trashcam_cameras list.
#
# Per-stream affinity (issue #5): each stream gets its own pod, its
# own tailnet hostname for WebRTC media (so Tailscale picks an
# independent DERP region per stream), and its own RTSP ingest
# hostname (so capture-host publish doesn't share blast radius with
# other streams). The viewer surface is also per-stream — operators
# open one tailnet hostname per camera. A unified dashboard is a
# separate concern (future work).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-cam-b
  namespace: trashmonitor
  labels:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trashmonitor
      trashmonitor.stream: cam-b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trashmonitor
        trashmonitor.stream: cam-b
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: trashmonitor
          image: ghcr.io/<your-org>/tailnet-trashmonitor:latest
          imagePullPolicy: Always
          env:
            - { name: TRASHMON_STREAM_ID, value: cam-b }
            # Replace <your-tailnet> to match TS_TAILNET in your .env.
            # entrypoint.sh renders mediamtx's webrtcAdditionalHosts as
            # <stream-id>-webrtc.<tailnet>, which must match the
            # cam-b-webrtc Service's tailscale.com/hostname below.
            - { name: TRASHMON_TAILNET, value: "<your-tailnet>.ts.net" }
          ports:
            - { name: http,        containerPort: 8080, protocol: TCP }
            - { name: https,       containerPort: 443,  protocol: TCP }
            - { name: rtsp,        containerPort: 8554, protocol: TCP }
            - { name: hls,         containerPort: 8888, protocol: TCP }
            - { name: api,         containerPort: 9997, protocol: TCP }
            - { name: metrics,     containerPort: 9998, protocol: TCP }
            - { name: webrtc-sig,  containerPort: 8889, protocol: TCP }
            - { name: webrtc-udp,  containerPort: 8189, protocol: UDP }
            - { name: webrtc-tcp,  containerPort: 8189, protocol: TCP }
          readinessProbe:
            httpGet: { path: /v3/paths/list, port: api }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v3/paths/list, port: api }
            periodSeconds: 30
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - { name: tmp,    mountPath: /tmp }
            - { name: caddy,  mountPath: /var/lib/caddy }
            - { name: config, mountPath: /config }
            - { name: tls,    mountPath: /etc/caddy/tls, readOnly: true }
      volumes:
        - { name: tmp,    emptyDir: {} }
        - { name: caddy,  emptyDir: {} }
        - { name: config, emptyDir: {} }
        - name: tls
          secret:
            secretName: trashmonitor-ephemera-tls
            optional: true
---
# Viewer surface: HTTP/HTTPS to the Caddy+SPA inside this stream's pod.
# Tailnet hostname: cam-b.<tailnet>.ts.net
apiVersion: v1
kind: Service
metadata:
  name: cam-b
  namespace: trashmonitor
  annotations:
    tailscale.com/hostname: cam-b
    tailscale.com/proxy-class: honey-sting-tailnet
  labels:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
  ports:
    - { name: http,  port: 80,  targetPort: http,  protocol: TCP }
    - { name: https, port: 443, targetPort: https, protocol: TCP }
---
# WebRTC: WHEP signaling + ICE media. Tailnet hostname:
# cam-b-webrtc.<tailnet>.ts.net — must match TRASHMON_TAILNET +
# the stream id in the Deployment env above, because
# entrypoint.sh renders this hostname into MediaMTX's
# webrtcAdditionalHosts so ICE candidates resolve.
apiVersion: v1
kind: Service
metadata:
  name: cam-b-webrtc
  namespace: trashmonitor
  annotations:
    tailscale.com/hostname: cam-b-webrtc
    tailscale.com/proxy-class: honey-sting-tailnet
  labels:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
  ports:
    - { name: whep,       port: 8889, targetPort: webrtc-sig, protocol: TCP }
    - { name: webrtc-udp, port: 8189, targetPort: webrtc-udp, protocol: UDP }
    - { name: webrtc-tcp, port: 8189, targetPort: webrtc-tcp, protocol: TCP }
---
# RTSP ingest from the capture host for this stream.
# Tailnet hostname: cam-b-rtsp.<tailnet>.ts.net
apiVersion: v1
kind: Service
metadata:
  name: cam-b-rtsp
  namespace: trashmonitor
  annotations:
    tailscale.com/hostname: cam-b-rtsp
    tailscale.com/proxy-class: honey-sting-tailnet
  labels:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: trashmonitor
    trashmonitor.stream: cam-b
  ports:
    - { name: rtsp, port: 8554, targetPort: rtsp, protocol: TCP }
