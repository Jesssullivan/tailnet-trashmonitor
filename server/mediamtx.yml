# MediaMTX configuration for trashmonitor.
# RTSP server accepts publishes from capture-host ffmpegs; HLS server
# fans the streams out to the SPA via hls.js.

logLevel: info
logDestinations: [stdout]

# Auth: tailnet is the boundary; allow anonymous publish/read/api.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

# RTSP server — capture hosts publish here.
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
rtspAuthMethods: [basic]   # we use noauth via paths below

# HLS — what the SPA consumes via hls.js.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes        # produce HLS even if no viewer is watching
hlsVariant: mpegts         # plain HLS works in every browser including hls.js
hlsSegmentCount: 6
hlsSegmentDuration: 1s
hlsAllowOrigins: ["*"]

# Disable everything else — keep the surface tight.
rtmp: no
srt: no
api: yes
apiAddress: :9997

# WebRTC — sub-second viewer path, replacing HLS for live monitoring.
# Both peers are tailnet-attached over CGNAT (100.64/10); the WireGuard
# underlay already handles NAT traversal, so MediaMTX only needs to
# advertise a host candidate pointing at the tailnet hostname of the
# `trashmonitor-webrtc` LoadBalancer Service. No STUN/TURN.
#
# webrtcAdditionalHosts must match the FQDN of the trashmonitor-webrtc
# Tailscale LB hostname (see server/k8s/service.yaml). Replace
# <your-tailnet> to match TS_TAILNET in your .env.
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: no
webrtcICEServers2: []
webrtcAdditionalHosts:
  - trashmonitor-webrtc.<your-tailnet>.ts.net

# Prometheus metrics for the cluster's observability stack to scrape.
metrics: yes
metricsAddress: :9998

# Pre-declare slots so the SPA can render "offline" tiles before any
# publisher connects. Replace these with your own camera identifiers
# (they match the `id` field in the ansible trashcam_cameras list and
# the `trashcam@<id>.service` instance name).
paths:
  cam-a:
  cam-b:
